# ==============================================
# Nginx Config untuk Webhook - cakrapamungkas.org
# Tambahkan ini di dalam server block HTTPS
# ==============================================
#
# Cara pakai:
# 1. Edit file: sudo nano /etc/nginx/sites-available/cakrapamungkas
# 2. Tambahkan block location di bawah ini DIDALAM server block HTTPS (port 443)
# 3. Test config: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx
#

    # Webhook endpoint untuk auto-deploy
    location /webhook {
        proxy_pass http://127.0.0.1:9000/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
        proxy_read_timeout 300s;
    }

    # Webhook health check
    location /webhook-health {
        proxy_pass http://127.0.0.1:9000/health;
        proxy_http_version 1.1;
    }
